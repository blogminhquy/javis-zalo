name: Release

on:
  push:
    tags: ["v*.*.*"]
  # Release from main without pushing a tag by hand: the job tags the version in package.json.
  # For sessions whose git access can push branches but not tags. A tag pushed by this job with
  # GITHUB_TOKEN does not start the push trigger above, so the same job finishes the release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Resolve the tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$GITHUB_REF_NAME" = "main" || { echo "Run it from main"; exit 1; }
            echo "TAG=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          else
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"
      - name: Create the tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists"; exit 1
          fi
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
      - name: Install from the tag tarball
        run: |
          npm install -g "https://codeload.github.com/$GITHUB_REPOSITORY/tar.gz/refs/tags/$TAG"
          javis-zalo --version
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e '
            const v = process.env.TAG.slice(1);
            const s = require("fs").readFileSync("CHANGELOG.md", "utf8");
            const start = s.indexOf("## [" + v + "]");
            if (start < 0) process.exit(1);
            const rest = s.slice(start).split("\n").slice(1).join("\n");
            const end = rest.search(/^## \[/m);
            require("fs").writeFileSync("notes.md", end < 0 ? rest : rest.slice(0, end));
          '
          gh release create "$TAG" --title "$TAG" --notes-file notes.md
